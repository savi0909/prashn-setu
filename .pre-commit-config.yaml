default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]   # §16.2: no large binaries in git
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ruff runs from backend/uv.lock, not from a pinned mirror rev. Two ruffs is
  # one too many: the mirror was pinned at v0.8.6 while the lock resolved 0.16.2,
  # and 0.16 changed how `assert cond, msg` wraps. Every commit was reformatted
  # locally into a shape CI then rejected. One version of truth, upgraded by
  # `uv lock --upgrade-package ruff` like any other dependency.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv --directory backend run ruff check --fix
        language: system
        files: ^backend/.*\.py$

      - id: ruff-format
        name: ruff-format
        entry: uv --directory backend run ruff format
        language: system
        files: ^backend/.*\.py$

      - id: mypy
        name: mypy (backend)
        entry: uv --directory backend run mypy app
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
