# Subject taxonomy — master copy (ADR 0002).
#
# Imported once from Appendix C of docs/02-examinations-and-syllabus.md, which
# was a starter guide, not an authority. This file is master from that import
# onward and is expected to grow; nothing asserts the two still agree.
#
# `code` is a stable identifier. Questions, blueprint sections and teacher
# assignments all anchor to it, so renaming one silently orphans every anchor —
# see RULE subj-004. Add codes freely; never rename or reuse one.
#
# `min_class_level` / `max_class_level` are the grades a subject is taught in.
# Both NULL means "taught in no grade", which is true of the competitive-only
# subjects at the bottom of this file and of nothing else.

subjects:
  # ------------------------------------------------------------- languages
  - code: HINDI
    name_en: Hindi
    name_hi: हिन्दी
    min_class_level: 1
    max_class_level: 12
    sort_order: 100

  - code: ENGLISH
    name_en: English
    name_hi: अंग्रेज़ी
    min_class_level: 1
    max_class_level: 12
    sort_order: 110

